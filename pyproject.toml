[project]
name = "xch1-aibox-mcp"
version = "1.0.0"
description = "MCP server for XCH1-AI-BOX: power (XCHP HID), target UART (CDC), device discovery"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.2.0,<2",
  "hidapi>=0.14.0",
  "pyserial>=3.5",
]

[project.scripts]
xch1-aibox-mcp = "xch1_aibox_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["xch1_aibox_mcp*"]
